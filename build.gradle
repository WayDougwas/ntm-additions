plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'ntm-additions'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // Mods from CurseForge: curse.maven:<name>-<projectId>:<fileId>
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly "curse.maven:hbm-ntm-1719328:9524060"
    compileOnly "curse.maven:golemcore-1719361:9523847"
    compileOnly "curse.maven:curios-309927:6529130"
}

// Fill the version into neoforge.mods.toml (plain replace, so other '$' characters are left alone).
processResources {
    inputs.property 'version', mod_version
    filesMatching('META-INF/neoforge.mods.toml') {
        filter { line -> line.replace('${mod_version}', mod_version) }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    archiveFileName = "ntm-additions-${mod_version}+${minecraft_version}-neoforge.jar"
    from('LICENSE') {
        rename { "LICENSE_${mod_id}" }
    }
    manifest {
        attributes(
                'Implementation-Title': mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor': mod_authors
        )
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
